<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fdfbf7">
    <title>Sin conexión · Llévalo</title>
    <script>
      (() => {
        const themeFromUrl = new URLSearchParams(window.location.search).get('theme');
        let preference = themeFromUrl;
        if (preference !== 'dark' && preference !== 'light') {
          try {
            preference = localStorage.getItem('llevalo_theme_preference');
          } catch {
            preference = null;
          }
        }
        const darkMode = preference === 'dark'
          || (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = darkMode ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = darkMode ? '#0b1120' : '#fdfbf7';
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        --page: #fdfbf7;
        --text: #172033;
        --surface: rgb(255 255 255 / 88%);
        --border: #f1e8df;
        --muted: #647084;
        --icon-border: #ffe0d2;
        --icon-background: #fff3ed;
        --eyebrow: #e64a19;
        --exit-border: #e8e4de;
        --exit-background: #fff;
        --exit-text: #475166;
        --exit-active: #f8f5f0;
        --backdrop-glow: rgb(255 87 34 / 9%);
        --card-shadow: 0 24px 70px rgb(75 44 24 / 10%);
        background: var(--page);
        color: var(--text);
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --page: #0b1120;
        --text: #f8fafc;
        --surface: rgb(15 23 42 / 94%);
        --border: #263244;
        --muted: #a6b0c2;
        --icon-border: #71321f;
        --icon-background: #351f19;
        --eyebrow: #fd8a61;
        --exit-border: #3a4659;
        --exit-background: #1e293b;
        --exit-text: #e2e8f0;
        --exit-active: #334155;
        --backdrop-glow: rgb(255 87 34 / 11%);
        --card-shadow: 0 24px 70px rgb(0 0 0 / 35%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 280px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse at 50% 30%, var(--backdrop-glow), transparent 58%),
          var(--page);
      }

      main {
        width: min(100%, 380px);
        padding: 32px 24px 24px;
        text-align: center;
        border: 1px solid var(--border);
        border-radius: 30px;
        background: var(--surface);
        box-shadow: var(--card-shadow);
      }

      .brand-mark {
        width: 58px;
        height: 58px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 19px;
        background: #ff5722;
        color: white;
        font-size: 34px;
        font-weight: 900;
        line-height: 1;
        box-shadow: 0 9px 22px rgb(255 87 34 / 25%);
      }

      .connection-icon {
        width: 76px;
        height: 76px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border: 1px solid var(--icon-border);
        border-radius: 25px;
        background: var(--icon-background);
        color: #ff5722;
      }

      .connection-icon svg {
        width: 38px;
        height: 38px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--eyebrow);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(24px, 7vw, 30px);
        font-weight: 850;
        letter-spacing: -0.045em;
      }

      .message {
        margin: 12px 0 26px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.65;
      }

      .actions {
        display: grid;
        gap: 11px;
      }

      button {
        min-height: 52px;
        width: 100%;
        border: 0;
        border-radius: 16px;
        font: inherit;
        font-size: 14px;
        font-weight: 750;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: transform 160ms ease, background-color 160ms ease;
      }

      button:active {
        transform: scale(0.98);
      }

      .retry {
        background: #ff5722;
        color: white;
        box-shadow: 0 8px 18px rgb(255 87 34 / 20%);
      }

      .retry:active {
        background: #ed4e1d;
      }

      .exit {
        border: 1px solid var(--exit-border);
        background: var(--exit-background);
        color: var(--exit-text);
      }

      .exit:active {
        background: var(--exit-active);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand-mark" aria-hidden="true">L</div>
      <div class="connection-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M2 8.8a15 15 0 0 1 17.4-2.1M5.5 12.5a9.5 9.5 0 0 1 6.8-2.7c1.1 0 2.2.2 3.2.6M9.2 16.2a4.5 4.5 0 0 1 4.8-.6M12 20h.01" />
          <path d="m3 3 18 18" />
        </svg>
      </div>
      <p class="eyebrow">Llévalo</p>
      <h1>Sin conexión a internet</h1>
      <p class="message">No pudimos conectarnos. Revisa tu conexión a internet e inténtalo de nuevo.</p>
      <div class="actions">
        <button class="retry" type="button" onclick="window.location.replace('https://llevalo.vercel.app/')">
          Recargar / Reintentar conexión
        </button>
        <button class="exit" type="button" onclick="window.location.href = 'llevalo://exit'">
          Salir de la app
        </button>
      </div>
    </main>
  </body>
</html>
